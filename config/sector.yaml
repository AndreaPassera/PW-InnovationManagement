# Team 10 · Underwater drones · client: Fincantieri
# Settings of the whole pipeline (01_extract -> 02_clean -> 03_landscape), read by src/config.py.
# Change values HERE, not in the code. The sector RULES (regular expressions, exclusion rules, corporate groups)
# stay in src/config.py because they are code: each one is commented and tested in tests/.

environment:
  env: PROD                 # TEST while developing (small PATSTAT extract), PROD for the numbers in the deck
  ipr_type: PI              # PI = patents of invention (the PW unit); UM = utility models (robustness run)

sector:
  name: Underwater drones
  client: FINCANTIERI       # harmonised group name of the client (src/config.py, GROUP_ALIASES)

years:
  min: 2000                 # earliest priority year of the family
  max: 2025
  truncation_window: 3      # last years incomplete (18-month publication lag): last complete year = max - 3 = 2022

query:
  match_level: family       # family: codes and texts of all applications pooled; application: on one application
  use_label_corrections: true
  block1_cpc: [B63G2008/002, B63G2008/004, B63G2008/005, B63G2008/007, B63G2008/008]   # unmanned underwater vessels
  block3_cpc: [B63, B25J]
  block3_context_cpc: [B63]
  block4_cpc: [B63G8/, B63C11/]
  benchmark_cpc: [B63]      # neighbouring field for the growth comparison (ships and marine technology)

validation:
  seed: 42
  sample_size: 100          # random in-sector families to hand-label
  broad_sample_size: 50     # broad-net families outside the sector (recall)
  block6_sample_size: 50    # families selected by block 6 alone (own stratum)
  precision_samples: [sector, block6]
  validation_exclude_files: [labels_test.csv]

extraction:
  chunk: 5000               # ids per IN (...) query on PROD
  sbert_model: graziasveva93/sbert-adapt-ub
  fetch_publications: true      # tls211: grant date, grant lag, claims
  fetch_citation_detail: true   # tls212 + tls215: citation origin, X/Y/A, NPL
  fetch_citation_cpc: true      # CPC of cited / citing families
  fetch_inventors: true         # tls206/207 inventors
  fetch_legal_events: true      # tls231 INPADOC legal events
  fetch_wipo_fields: true       # tls230 WIPO 35 fields
  fetch_benchmark: true         # families per year: all patents and the neighbouring field

landscape:                  # 03_landscape
  main_sample: all          # all | without block-6-only
  split_year: 2015          # incumbents: first family before this year; entrants: from it
  top_n: 15
  min_families_score: 10    # volume gate for the Step 3 shortlist
  run_patstat: true         # TIP only: query the first patent ever (any field) of the top applicants ("new to patenting", 2.2)
  run_bertopic: true        # BERTopic check of the NMF topics (2.4.2): needs bertopic, umap-learn (k-means clustering, 2.4.2)
